<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task App</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 8px; }
    button { padding: 8px 12px; cursor: pointer; }
    li { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #ddd; }
  </style>
</head>
<body>
  <h1>Task App</h1>
  <form id="form">
    <input id="title" placeholder="New task" required>
    <button type="submit">Add</button>
  </form>
  <ul id="list"></ul>

  <script>
    const list = document.getElementById('list');
    const form = document.getElementById('form');
    const input = document.getElementById('title');

    async function load() {
      const res = await fetch('/api/tasks');
      const tasks = await res.json();
      list.innerHTML = '';
      tasks.forEach(t => {
        const li = document.createElement('li');
        li.textContent = t.title;
        const del = document.createElement('button');
        del.textContent = 'Delete';
        del.onclick = async () => { await fetch('/api/tasks/' + t.id, { method: 'DELETE' }); load(); };
        li.appendChild(del);
        list.appendChild(li);
      });
    }

    form.addEventListener('submit', async e => {
      e.preventDefault();
      await fetch('/api/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: input.value })
      });
      input.value = '';
      load();
    });

    load();
  </script>
</body>
</html>
